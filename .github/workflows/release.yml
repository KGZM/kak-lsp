name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            cargo_target: x86_64-unknown-linux-musl
          - target: aarch64-linux
            cargo_target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: dtolnay/rust-toolchain@stable

      - name: add musl targets
        run: rustup target add ${{ matrix.cargo_target }}

      - name: install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: build and package
        run: |
          make package DIST_TARGET=${{ matrix.target }}
          VERSION=${GITHUB_REF_NAME#v}
          ARTIFACT=kak-lsp-${VERSION}-${{ matrix.target }}
          cargo tree --locked > dist/${{ matrix.target }}/deps-kak-lsp.txt
          tar -czf ${ARTIFACT}.tar.gz -C dist/${{ matrix.target }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: release
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

